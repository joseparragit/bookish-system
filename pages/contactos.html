<section class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      
      <div class="formulario-contacto p-4 p-md-5 rounded shadow">
        <h2 class="text-center mb-4 titulo-instalacion">Envianos tu consulta</h2>
        
        <form>
          <!-- Nombre -->
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre y Apellido</label>
            <input type="text" class="form-control" id="nombre" placeholder="Ej: Juan Pérez" required>
          </div>

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="email" placeholder="nombre@ejemplo.com" required>
          </div>

          <!-- Teléfono -->
          <div class="mb-3">
            <label for="telefono" class="form-label">Teléfono / WhatsApp</label>
            <input type="tel" class="form-control" id="telefono" placeholder="Ej: +54 9 11 1234-5678">
          </div>

          <!-- Selección de producto -->
          <div class="mb-3">
            <label for="producto" class="form-label">Producto de interés</label>
            <select class="form-select" id="producto">
              <option selected disabled>Seleccioná una opción...</option>
              <option value="wall-panel-interior">Wall Panel Interior</option>
              <option value="wpc-exterior">Deck / Revestimiento WPC Exterior</option>
              <option value="accesorios">Clips y Accesorios de Instalación</option>
              <option value="otro">Otra consulta</option>
            </select>
          </div>

          <!-- Mensaje -->
          <div class="mb-3">
            <label for="mensaje" class="form-label">Mensaje o medidas estimadas</label>
            <textarea class="form-control" id="mensaje" rows="4" placeholder="Contanos sobre tu proyecto o consultá por cotizaciones..." required></textarea>
          </div>

          <!-- Botón de envío -->
          <div class="d-grid mt-4">
            <button type="submit" class="btn btn-warning fw-bold py-2">
              <i class="bi bi-send-fill me-2"></i>Enviar consulta
            </button>
          </div>
        </form>

      </div>

    </div>
  </div>
</section>
